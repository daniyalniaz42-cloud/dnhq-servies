<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNHQ SERVICES | Official</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<!-- PDF Libraries - Correct Order -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root { --gold: #fbbf24; --card: #111827; }
body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #0f172a; color: #f1f5f9; padding-bottom: 100px; }
.brand-header { background: #000; padding: 30px 20px; text-align: center; border-bottom: 4px solid var(--gold); }
.logo-main { height: 85px; }
.brand-title { color: var(--gold); font-size: 24px; font-weight: 900; margin-top: 15px; }
.wrapper { padding: 15px; max-width: 600px; margin: 0 auto; }
.svc-item { background: var(--card); border: 1px solid #1f2937; border-radius: 15px; margin: 10px 0; padding: 15px; display: flex; justify-content: space-between; cursor: pointer; }
.svc-item.selected { border: 2px solid var(--gold); background: #000; }
.checkout-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.95); border-top: 2px solid var(--gold); padding: 15px; display: none; }
.btn-wa { background: #22c55e; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
.modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
.modal-content { background: #111827; margin: 10% auto; padding: 20px; border: 2px solid var(--gold); border-radius: 15px; width: 90%; max-width: 500px; }
.modal-close { float: right; font-size: 24px; cursor: pointer; color: #94a3b8; }
.form-input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; }
.verify-btn { width: 100%; background: var(--gold); color: black; padding: 14px; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; }
.history-item { background: #1e293b; border-radius: 10px; padding: 12px; margin: 10px 0; border-left: 3px solid var(--gold); }
.pdf-sm { background: #3b82f6; color: white; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; margin-top: 8px; }
#adminView { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #070a13; z-index: 9999; padding: 20px; overflow-y: auto; }
.man-input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #333; background: #000; color: white; }
.log-card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 15px; margin: 10px 0; }
.del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
.pdf-btn { background: var(--gold); color: black; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; float: right; }
.loading { text-align: center; padding: 20px; color: var(--gold); }
.badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px; }
.badge-website { background: #8b5cf6; color: white; }
.badge-manual { background: #64748b; color: white; }
</style>
</head>
<body>

<header class="brand-header">
<img src="1773452778552.jpeg" class="logo-main" id="brandLogo">
<div class="brand-title">DNHQ SERVICES</div>
</header>

<div class="wrapper">
<button onclick="openHistoryModal()" style="width:100%;padding:15px;background:var(--gold);border:none;border-radius:12px;font-weight:800;cursor:pointer;margin:20px 0;">
<i class="fas fa-clock-rotate-left"></i> Check Service History
</button>

<!-- Services -->
<div class="svc-item" onclick="toggleSvc(this, 'AC Service', 4000)">
<div><b>AC Master Service</b><p style="color:#94a3b8;margin:5px 0 0 0;">Chemical Wash</p></div>
<div style="font-weight:800;color:var(--gold);">Rs 4,000</div>
</div>
<div class="svc-item" onclick="toggleSvc(this, 'AC Gas', 7000)">
<div><b>AC Gas (1 Ton)</b><p style="color:#94a3b8;margin:5px 0 0 0;">Full Refill</p></div>
<div style="font-weight:800;color:var(--gold);">Rs 7,000</div>
</div>
</div>

<!-- Checkout Bar -->
<div class="checkout-bar" id="cart">
<div style="display:flex;justify-content:space-between;max-width:600px;margin:0 auto;">
<div><small style="color:#94a3b8;">Total Bill</small><div style="font-size:20px;font-weight:900;">Rs <span id="billTotal">0</span></div></div>
<button class="btn-wa" onclick="placeOrder()"><i class="fab fa-whatsapp"></i> PLACE ORDER</button>
</div>
</div>

<!-- History Modal -->
<div id="historyModal" class="modal">
<div class="modal-content">
<span class="modal-close" onclick="closeHistoryModal()">&times;</span>
<div id="verifyStep">
<h3 style="text-align:center;color:var(--gold);">🔐 Check Service History</h3>
<input type="tel" id="histPhone" class="form-input" placeholder="Phone: 03XX-XXXXXXX">
<button class="verify-btn" onclick="fetchCustomerHistory()">Show My History</button>
<div id="histError" style="color:#ef4444;text-align:center;margin:10px 0;display:none;"></div>
</div>
<div id="showStep" style="display:none;">
<h3 style="text-align:center;color:var(--gold);">📜 Service History</h3>
<div id="custInfo" style="background:#0f172a;padding:12px;border-radius:8px;margin:15px 0;"></div>
<div id="histList" style="max-height:300px;overflow-y:auto;"></div>
<button onclick="downloadCustomerHistoryPDF()" style="width:100%;background:#22c55e;color:white;border:none;padding:12px;border-radius:8px;margin-top:15px;font-weight:bold;">📥 Download All (PDF)</button>
</div>
</div>
</div>

<!-- Confirm Dialog -->
<div id="confirmDialog" class="modal">
<div class="modal-content">
<h3 style="color:var(--gold);margin:0 0 20px 0;">📋 CONFIRM BILL</h3>
<div id="confirmBody"></div>
<div style="display:flex;gap:10px;margin-top:20px;">
<button onclick="closeConfirmDialog()" style="flex:1;background:#ef4444;color:white;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;">❌ Cancel</button>
<button onclick="confirmAndGeneratePDF()" style="flex:1;background:#10b981;color:white;border:none;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer;">✅ Confirm & PDF</button>
</div>
</div>
</div>

<!-- Admin Panel -->
<div id="adminView">
<h2 style="color:var(--gold);">DNHQ DASHBOARD</h2>
<button onclick="document.getElementById('adminView').style.display='none'" style="background:red;color:white;border:none;padding:5px 15px;border-radius:5px;cursor:pointer;float:right;">CLOSE</button>
<div style="clear:both;margin:20px 0;">
<input type="text" id="man_name" class="man-input" placeholder="Customer Name">
<input type="tel" id="man_phone" class="man-input" placeholder="Phone">
<input type="text" class="man-input" placeholder="Work Description" id="man_work">
<input type="number" class="man-input" placeholder="Amount (Rs)" id="man_amount">
<button onclick="saveManualOrder()" style="width:100%;background:var(--gold);color:black;border:none;padding:12px;border-radius:8px;font-weight:bold;margin-top:10px;">💾 SAVE ORDER</button>
</div>
<div id="logItems" class="loading">Loading...</div>
</div>

<footer style="text-align:center;padding:20px;color:#64748b;">
<div onclick="openAdmin()" style="cursor:pointer;font-size:11px;opacity:0.5;">Admin Access</div>
<p>© 2026 DNHQ Services | 📞 +92 315 2458657</p>
</footer>

<script>
// ✅ CONFIG
let cart = [], currentCustData = null, pendingOrderData = null, allOrders = [];
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaKx8K_lExSVwpk5TaH2HUFoZ_DkAll3wRxTVnG1pX5E7p7ThMJ3-r4kwpcoPGMIyJ7A/exec"; // 👈 Yahan apna URL paste karein
const PHONE = "+92 315 2458657";

// ✅ UTILS
function toggleSvc(el, name, price) {
    const idx = cart.findIndex(c => c.name === name);
    if (idx > -1) { cart.splice(idx, 1); el.classList.remove('selected'); }
    else { cart.push({name, price}); el.classList.add('selected'); }
    updateCart();
}

function updateCart() {
    const total = cart.reduce((a, b) => a + b.price, 0);
    const bar = document.getElementById('cart');
    bar.style.display = cart.length > 0 ? 'block' : 'none';
    document.getElementById('billTotal').innerText = total.toLocaleString();
}

function openAdmin() {
    const pin = prompt("Admin PIN:");
    if(pin === "dnhq123") {
        document.getElementById('adminView').style.display = 'block';
        loadOrders();
    } else if(pin) alert("Wrong PIN!");
}

// ✅ ORDER FUNCTIONS
async function saveManualOrder() {
    const name = document.getElementById('man_name').value.trim();
    const phone = document.getElementById('man_phone').value.trim();
    const work = document.getElementById('man_work').value.trim();
    const amount = parseFloat(document.getElementById('man_amount').value) || 0;
    
    if(!name || !phone || !work) return alert("Fill all fields!");
    
    const payload = {
        date: new Date().toISOString(),
        client: name.toUpperCase(),
        phone: phone,
        work: work + " (Rs " + amount + ")",
        subtotal: amount,
        total: amount,
        balance_due: amount,
        entry_type: 'order',
        order_status: 'received',
        order_source: 'manual'
    };
    
    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        alert("✅ Saved!");
        loadOrders();
    } catch(e) { alert("Error: " + e.message); }
}

async function loadOrders() {
    const container = document.getElementById('logItems');
    container.innerHTML = '<div class="loading">Loading...</div>';
    
    try {
        const res = await fetch(SCRIPT_URL + "?t=" + Date.now());
        const data = await res.json();
        if(data.error) throw new Error(data.error);
        
        allOrders = data;
        container.innerHTML = data.map((d, i) => `
            <div class="log-card">
                <button class="pdf-btn" onclick='showConfirmDialog(${JSON.stringify(d).replace(/'/g,"&apos;")})'>📄 PDF</button>
                <b>${d.client||'Unknown'}</b> 
                <span class="badge badge-${d.order_source==='website'?'website':'manual'}">${d.order_source||'manual'}</span><br>
                <small style="color:#94a3b8;">📱 ${d.phone||'N/A'}</small><br>
                <small>${(d.work||"").substring(0,40)}...</small><br>
                <b style="color:var(--gold);">Rs ${(parseFloat(d.total)||0).toLocaleString()}</b><br>
                <button class="del-btn" onclick="deleteOrder('${d.timestamp}')">🗑️ Delete</button>
            </div>
        `).join('');
    } catch(e) {
        container.innerHTML = `<p style="color:#ef4444;">Error: ${e.message}</p>`;
    }
}

async function deleteOrder(ts) {
    if(!confirm("Delete this order?")) return;
    const pin = prompt("Admin PIN:");
    if(pin !== "dnhq_delete_2026") return alert("Wrong PIN");
    
    try {
        await fetch(`${SCRIPT_URL}?deleteRow=true&timestamp=${ts}&pin=${pin}`);
        alert("✅ Deleted");
        loadOrders();
    } catch(e) { alert("Error: " + e.message); }
}

// ✅ PLACE ORDER (Website)
async function placeOrder() {
    if(cart.length === 0) return alert("Select a service!");
    const name = prompt("Your Name:");
    const phone = prompt("Your Phone:");
    if(!name || !phone) return alert("Name & Phone required!");
    
    const total = cart.reduce((a, b) => a + b.price, 0);
    const work = cart.map(c => c.name + " (Rs " + c.price + ")").join(", ");
    
    const payload = {
        date: new Date().toISOString(),
        client: name.toUpperCase(),
        phone: phone,
        work: work,
        subtotal: total,
        total: total,
        balance_due: total,
        entry_type: 'order',
        order_status: 'received',
        order_source: 'website'
    };
    
    try {
        await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        
        const msg = `*NEW ORDER*%0A👤 ${name}%0A📱 ${phone}%0A💰 Rs ${total}%0A🛠️ ${work}`;
        window.open(`https://wa.me/923152458657?text=${msg}`, '_blank');
        
        alert("✅ Order Placed!");
        cart = [];
        updateCart();
        document.querySelectorAll('.svc-item').forEach(el => el.classList.remove('selected'));
    } catch(e) { alert("Error: " + e.message); }
}

// ✅ PDF GENERATION (FIXED)
function getJsPDF() {
    if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
    if (window.jsPDF) return window.jsPDF;
    return null;
}

async function generatePDF(order) {
    try {
        const jsPDF = getJsPDF();
        if (!jsPDF) {
            alert('❌ PDF library not loaded! Please check internet connection.');
            return;
        }
        
        const doc = new jsPDF();
        const client = order.client || "Customer";
        const phone = order.phone || "N/A";
        const date = order.date ? new Date(order.date).toLocaleDateString() : "N/A";
        const total = parseFloat(order.total) || 0;
        const balance = parseFloat(order.balance_due) || total;
        
        // Header
        doc.setFillColor(0, 0, 0);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(251, 191, 36);
        doc.setFontSize(24);
        doc.text("DNHQ SERVICES", 105, 25, { align: "center" });
        
        // Info
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text(`Client: ${client}`, 20, 60);
        doc.text(`Phone: ${phone}`, 20, 70);
        doc.text(`Date: ${date}`, 20, 80);
        
        // Work Details
        doc.setFontSize(14);
        doc.text("SERVICE DETAILS:", 20, 100);
        const work = order.work || "No work specified";
        const splitWork = doc.splitTextToSize(work, 170);
        doc.setFontSize(11);
        doc.text(splitWork, 20, 110);
        
        // Amount
        doc.setFontSize(16);
        doc.text(`Total Amount: Rs ${total.toLocaleString()}`, 20, 140);
        if (balance > 0 && balance !== total) {
            doc.text(`Balance Due: Rs ${balance.toLocaleString()}`, 20, 150);
        }
        
        // Footer
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text("Contact: +92 315 2458657", 105, 280, { align: "center" });
        doc.text("DNHQ Services - Professional AC & Electrical Work", 105, 285, { align: "center" });
        
        // Save
        const fname = `DNHQ_${client.replace(/[^a-z0-9]/gi, '_')}_${Date.now()}.pdf`;
        doc.save(fname);
        
    } catch (error) {
        console.error("PDF Error:", error);
        alert('❌ PDF Generation Failed: ' + error.message);
    }
}

function showConfirmDialog(order) {
    pendingOrderData = order;
    const total = parseFloat(order.total) || 0;
    const balance = parseFloat(order.balance_due) || total;
    
    document.getElementById('confirmBody').innerHTML = `
        <p><b>Client:</b> ${order.client||'N/A'}</p>
        <p><b>Phone:</b> ${order.phone||'N/A'}</p>
        <p><b>Work:</b> ${order.work||'N/A'}</p>
        <p style="font-size:18px;color:var(--gold);"><b>Total: Rs ${total.toLocaleString()}</b></p>
        ${balance !== total ? `<p style="color:#ef4444;"><b>Balance: Rs ${balance.toLocaleString()}</b></p>` : ''}
    `;
    document.getElementById('confirmDialog').style.display = 'block';
}

function closeConfirmDialog() {
    document.getElementById('confirmDialog').style.display = 'none';
    pendingOrderData = null;
}

function confirmAndGeneratePDF() {
    if (!pendingOrderData) return alert("No order selected!");
    generatePDF(pendingOrderData);
    closeConfirmDialog();
}

// ✅ HISTORY FUNCTIONS
function openHistoryModal() {
    document.getElementById('historyModal').style.display = 'block';
    document.getElementById('verifyStep').style.display = 'block';
    document.getElementById('showStep').style.display = 'none';
    document.getElementById('histPhone').value = '';
    document.getElementById('histError').style.display = 'none';
}

function closeHistoryModal() {
    document.getElementById('historyModal').style.display = 'none';
}

async function fetchCustomerHistory() {
    const phone = document.getElementById('histPhone').value.trim();
    const err = document.getElementById('histError');
    
    if (!phone) {
        err.textContent = "Enter phone number";
        err.style.display = 'block';
        return;
    }
    
    try {
        const res = await fetch(`${SCRIPT_URL}?getHistory=true&phone=${encodeURIComponent(phone)}`);
        const data = await res.json();
        
        if (data.error) throw new Error(data.error);
        if (!data || data.length === 0) {
            err.textContent = "❌ No records found";
            err.style.display = 'block';
            return;
        }
        
        currentCustData = data;
        document.getElementById('verifyStep').style.display = 'none';
        document.getElementById('showStep').style.display = 'block';
        
        const total = data.reduce((sum, o) => sum + (parseFloat(o.total)||0), 0);
        document.getElementById('custInfo').innerHTML = `
            <b>👤 ${data[0].client||'Customer'}</b><br>
            <b>📱 ${phone}</b><br>
            <b>Orders: ${data.length} | Total: Rs ${total.toLocaleString()}</b>
        `;
        
        document.getElementById('histList').innerHTML = data.map((o, i) => `
            <div class="history-item">
                <b>#${i+1} - ${o.date ? new Date(o.date).toLocaleDateString() : 'N/A'}</b><br>
                <small style="color:#94a3b8;">${(o.work||"").substring(0,60)}</small><br>
                <span style="color:var(--gold);font-weight:bold;">Rs ${(parseFloat(o.total)||0).toLocaleString()}</span>
                <br><button class="pdf-sm" onclick='generatePDF(${JSON.stringify(o).replace(/'/g,"&apos;")})'>📄 Download PDF</button>
            </div>
        `).join('');
        
    } catch (e) {
        err.textContent = "Error: " + e.message;
        err.style.display = 'block';
    }
}

async function downloadCustomerHistoryPDF() {
    if (!currentCustData || currentCustData.length === 0) return alert("No data!");
    
    try {
        const jsPDF = getJsPDF();
        if (!jsPDF) return alert('PDF library not loaded!');
        
        const doc = new jsPDF();
        const cust = currentCustData[0];
        const grandTotal = currentCustData.reduce((s, o) => s + (parseFloat(o.total)||0), 0);
        
        doc.setFillColor(0, 0, 0);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(251, 191, 36);
        doc.setFontSize(24);
        doc.text("DNHQ SERVICES", 105, 25, { align: "center" });
        doc.setFontSize(14);
        doc.text("SERVICE HISTORY", 105, 35, { align: "center" });
        
        doc.setTextColor(0, 0, 0);
        doc.setFontSize(12);
        doc.text(`Client: ${cust.client||'N/A'}`, 20, 60);
        doc.text(`Phone: ${cust.phone||'N/A'}`, 20, 70);
        
        const rows = currentCustData.map(o => [
            o.date ? new Date(o.date).toLocaleDateString() : 'N/A',
            (o.work||"").substring(0, 40),
            "Rs " + (parseFloat(o.total)||0).toLocaleString()
        ]);
        
        doc.autoTable({
            startY: 90,
            head: [['DATE', 'SERVICE', 'AMOUNT']],
            body: rows,
            theme: 'grid'
        });
        
        const finalY = doc.lastAutoTable.finalY + 20;
        doc.setFontSize(16);
        doc.text(`GRAND TOTAL: Rs ${grandTotal.toLocaleString()}`, 20, finalY);
        
        doc.save(`DNHQ_History_${cust.phone||'customer'}.pdf`);
        
    } catch (e) {
        alert("PDF Error: " + e.message);
    }
}

// ✅ EXPORTS TO WINDOW
window.toggleSvc = toggleSvc;
window.updateCart = updateCart;
window.openAdmin = openAdmin;
window.saveManualOrder = saveManualOrder;
window.loadOrders = loadOrders;
window.deleteOrder = deleteOrder;
window.placeOrder = placeOrder;
window.generatePDF = generatePDF;
window.showConfirmDialog = showConfirmDialog;
window.closeConfirmDialog = closeConfirmDialog;
window.confirmAndGeneratePDF = confirmAndGeneratePDF;
window.openHistoryModal = openHistoryModal;
window.closeHistoryModal = closeHistoryModal;
window.fetchCustomerHistory = fetchCustomerHistory;
window.downloadCustomerHistoryPDF = downloadCustomerHistoryPDF;

// ✅ INIT
document.addEventListener('DOMContentLoaded', function() {
    console.log('✅ DNHQ Services Loaded');
    updateCart();
});
</script>
</body>
</html>
